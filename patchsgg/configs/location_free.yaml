# =============================================================================
# Location-Free Scene Graph Generation (Pix2SG-style) on Visual Genome
# =============================================================================
# Fully supervised and location-free:
#   train: image -> graph sequence
#   eval:  image -> graph sequence
#
# This is NOT the text->image zero-shot experiment. The model never receives
# bounding boxes, masks, or coordinate tokens. Visual Genome boxes may still be
# used offline by the dataset loader to derive consistent instance identities,
# but they are not passed to the model.
#
# This file is standalone; it does not inherit from base.yaml.
# =============================================================================

seed: 4
device: cuda

# Separate directory for the real long-running experiment.
# Do not mix it with the 1-epoch smoke-test checkpoints.
output_dir: outputs/location_free_pix2sg_vg_full

num_workers: 10

# =============================================================================
# Graph vocabulary
# =============================================================================
# Training sequences contain at most 55 relation quintuples.
# This is separate from eval.max_rels, which controls how many relations
# can be generated during autoregressive evaluation.
vocab:
  n_preds: 51
  n_entities: 151
  max_instance_id: 30
  random_max_instance_id: 10
  max_num_rels: 55

# =============================================================================
# Image encoder
# =============================================================================
# The original LF-SGG/Pix2SG setup uses a different ViT implementation.
# This repository uses CLIP ViT-B/16 as the supported image encoder.
encoders:
  space: clip
  clip_model: ViT-B/16

  image_token_mode: patch
  text_token_mode: pooled
  max_text_tokens: 32

  # Training and evaluation are both image-conditioned.
  # Do not build an unused text encoder.
  build_only_required: true

  resize_dim: 224
  clip_resize_dim: 224

# =============================================================================
# Conditioning bridge
# =============================================================================
# Train and evaluation both use image features, so there is no train/test
# text-image modality gap that needs CapDec/DeCap correction.
bridge:
  type: identity

  # Unused for identity bridge, retained because they are supported config keys.
  types: null
  noise_std: 0.08
  projection_temperature: 0.01
  memory_path: checkpoints/decap_memory.pt
  project_tokens: true

# =============================================================================
# GPT-2 graph decoder
# =============================================================================
# GPT-2's language tokenizer is NOT used.
# The transformer operates on PatchSGG's structured graph-token vocabulary.
#
# 300 relations require:
#
#   START + (300 relations * 5 tokens) = 1501 positions
#
# GPT-2 normally supports 1024 positions, so the position table is extended.
decoder:
  type: gpt2_cross_attn
  model_name: openai-community/gpt2
  revision: main
  cache_dir: null
  local_files_only: false

  freeze_pretrained: false

  # -----------------------------------------------------------
  # Optional LoRA adaptation
  # -----------------------------------------------------------
  lora:
    enabled: false
    r: 8
    alpha: 16
    dropout: 0.05
    bias: none

  gradient_checkpointing: true
  tie_graph_embeddings: true

  max_seq_len: 1501
  extend_positions: true
  dropout: 0.1

# =============================================================================
# Training objective
# =============================================================================
# Weighted CE with freq_path=null keeps the project's END/NOISE weighting
# without applying predicate-frequency weighting.
loss:
  type: ce_weighted

  label_smoothing: 0.0
  freq_path: null

  # These options matter only for matching_ce, but are retained explicitly.
  weighted: false
  matcher_n: 3
  matcher_depth: 10

# =============================================================================
# Visual Genome
# =============================================================================
data:
  dataset: vg

  text_view: serialize
  serialize_with_instances: false
  captions_cache: null

  vg:
    roidb_file: /datasets/niyayesh/LFS2G2_VG/VG-SGG.h5
    dict_file: /datasets/niyayesh/LFS2G2_VG/VG-SGG-dicts.json
    image_meta: /datasets/niyayesh/LFS2G2_VG/image_data.json

    # Root containing:
    #   VG_100K/
    #   VG_100K_2/
    image_dir: /datasets/niyayesh/LFS2G2_VG

    instance_iou: 0.5

    # Standard validation subset used by this pipeline.
    num_val_images: 5000

    # Use the complete available dataset.
    num_images: -1

    filter_empty_rels: true

    # Keep false because the current PatchSGG loader's duplicate-relation
    # handling is not identical to the original LF-SGG implementation.
    filter_duplicate_rels: false

    image_resize_mode: center_crop

# =============================================================================
# Optimization
# =============================================================================
# Long-running LF-SGG-style experiment:
#
#   optimizer: AdamW
#   learning rate: 4e-5
#   weight decay: 1e-4
#   effective batch size: 16
#   gradient clipping: 0.1
#   maximum epochs: 200
#
# Physical batch 4 * gradient accumulation 4 = effective batch 16.
train:
  train_modality: image

  batch_size: 4
  accumulate_grad_batches: 4

  lr: 4.0e-5
  weight_decay: 1.0e-4

  max_epochs: 200

  # Full validation every 5 epochs.
  # Do NOT validate every epoch: autoregressive 300-relation generation
  # is expensive.
  eval_every_epochs: 5

  log_every_steps: 50

  grad_clip: 0.1
  precision: 16-mixed

  # Patience is counted in validation checks.
  # With validation every 5 epochs, patience 10 means training can tolerate
  # approximately 50 epochs without an improvement in val/R@20.
  early_stopping_patience: 10

# =============================================================================
# Location-free inference / validation
# =============================================================================
# Full LF-SGG-style generation:
#
#   - generate up to 300 relations
#   - sample entity classes using temperature 1.75 and top-p 0.95
#   - greedy selection for the remaining structured token types
#   - evaluate R@20 / R@50 / R@100
#   - use branched instance matching with B=3
eval:
  eval_modality: image

  batch_size: 1

  ks: [20, 50, 100]

  # Full evaluation generation length.
  max_rels: 300

  temperature: 1.75
  top_p: 0.95
  top_k: 0

  entity_sampling: stochastic

  # Generate the configured number of relation slots rather than stopping
  # early on END.
  allow_end: false

  matcher_n: 3
  matcher_depth: 10

  # Real image->graph evaluation requires the compiled branched matcher.
  matcher_identity_fallback: false