# =============================================================================
# Location-Free Scene Graph Generation (Pix2SG-style) on Visual Genome
# =============================================================================
# Fully supervised and location-free:
#   train: image -> graph sequence
#   eval:  image -> graph sequence
#
# This is NOT the text->image zero-shot experiment. The model never receives
# bounding boxes, masks, or coordinate tokens. Visual Genome boxes may still be
# used offline by the dataset loader to derive consistent instance identities,
# but they are not passed to the model.
#
# This file is standalone; it does not inherit from base.yaml.
# =============================================================================

seed: 4
device: cuda
output_dir: outputs/location_free_pix2sg_vg
num_workers: 10

# Exact Visual Genome token layout used by LF-SGG/Pix2SG.
# Training sequences contain at most 55 relation quintuples. This is separate
# from eval.max_rels, which controls how many relations are generated.
vocab:
  n_preds: 51
  n_entities: 151
  max_instance_id: 30
  random_max_instance_id: 10
  max_num_rels: 55

# -----------------------------------------------------------------------------
# Image encoder
# -----------------------------------------------------------------------------
# The original paper's released ViT-B model uses a contrastively pretrained
# EVA ViT at 448 px. This repository does not implement EVA, so CLIP ViT-B/16
# patch tokens are the closest directly supported image-only substitute.
encoders:
  space: clip                    # toy | clip | dinov2_talk2dino
  clip_model: ViT-B/16
  image_token_mode: patch        # use the full patch-token set, not pooled CLS
  text_token_mode: pooled        # unused because train/eval modalities are image
  max_text_tokens: 32            # unused in this experiment
  resize_dim: 224                # native CLIP ViT-B/16 image resolution

# -----------------------------------------------------------------------------
# Conditioning bridge
# -----------------------------------------------------------------------------
# Image features condition the decoder during both training and evaluation, so
# there is no text-image modality gap to correct.
bridge:
  type: identity                 # identity | capdec_noise | decap_projection
  types: null
  noise_std: 0.08                # unused by identity
  projection_temperature: 0.01   # unused by identity
  memory_path: checkpoints/decap_memory.pt
  project_tokens: true

# -----------------------------------------------------------------------------
# Hugging Face GPT-2 graph decoder
# -----------------------------------------------------------------------------
# The graph still uses PatchSGG's 245-token structured vocabulary. GPT-2's
# English BPE tokenizer is NOT used. We reuse GPT-2's pretrained causal
# transformer blocks and native positional embeddings, while learning:
#   - graph-token embeddings
#   - the visual-conditioning projection
#   - newly added cross-attention layers
#   - the graph-vocabulary output head
#
# Standard GPT-2 supports 1,024 positions, while 300 relations need 1,501
# positions including START. extend_positions copies the pretrained first 1,024
# position embeddings and initializes only the additional positions.
decoder:
  type: gpt2_cross_attn
  model_name: openai-community/gpt2
  revision: main
  cache_dir: null                 # null -> Hugging Face's normal cache directory
  local_files_only: false         # true after the checkpoint is cached for offline runs

  freeze_pretrained: false        # fine-tune GPT-2 self-attention/MLP weights
  gradient_checkpointing: true    # reduce training memory
  tie_graph_embeddings: true      # tie graph input embedding and output head
  extend_positions: true
  dropout: 0.1

# -----------------------------------------------------------------------------
# Training objective
# -----------------------------------------------------------------------------
# Pix2SG uses categorical cross-entropy over the entire vocabulary. Its released
# VG implementation downweights END and NOISE tokens even when predicate-frequency
# weighting is disabled. In this project, ce_weighted with freq_path: null
# reproduces that END/NOISE treatment.
loss:
  type: ce_weighted              # ce | ce_weighted | matching_ce | order_agnostic
  label_smoothing: 0.0
  freq_path: null                # keep null for paper-style END/NOISE weighting only
  weighted: false                # relevant only to matching_ce
  matcher_n: 3                   # relevant only to matching_ce
  matcher_depth: 10              # relevant only to matching_ce

# -----------------------------------------------------------------------------
# Visual Genome data
# -----------------------------------------------------------------------------
data:
  dataset: vg                    # vg | toy

  # These text-view options are unused in image-conditioned training, but are
  # kept explicit because they are part of this project's data config schema.
  text_view: serialize           # serialize | llm_caption | mix
  serialize_with_instances: false
  captions_cache: null

  vg:
    roidb_file: data/vg/VG-SGG.h5
    dict_file: data/vg/VG-SGG-dicts.json
    image_meta: data/vg/image_data.json
    image_dir: data/vg/images
    instance_iou: 0.5
    num_val_images: 5000
    filter_empty_rels: true
    deduplicate_relations: false
    image_resize_mode: center_crop   # center_crop | stretch
    num_images: -1               # -1 = use the complete split

# -----------------------------------------------------------------------------
# Optimization
# -----------------------------------------------------------------------------
# Paper: AdamW, constant lr 4e-5, weight decay 1e-4, batch size 16,
# gradient clipping 0.1, up to 200 epochs with early stopping.
#
# This repository currently has no EarlyStopping callback, so max_epochs is the
# hard stopping point unless training is stopped manually or the callback is added.
train:
  train_modality: image          # crucial: makes this non-zero-shot
  batch_size: 16
  lr: 4.0e-5
  weight_decay: 1.0e-4
  max_epochs: 200
  eval_every_epochs: 5
  log_every_steps: 50
  grad_clip: 0.1

# -----------------------------------------------------------------------------
# Location-free inference and evaluation
# -----------------------------------------------------------------------------
# Paper: generate 300 relations; nucleus-sample entity classes with temperature
# 1.75 and top-p 0.95; greedily choose instance and predicate tokens; evaluate
# R@20/R@50/R@100 with heuristic matcher branching factor B=3.
eval:
  eval_modality: image           # crucial: image -> graph evaluation
  batch_size: 1                  # conservative for uncached 300-relation AR decoding
  ks: [20, 50, 100]
  max_rels: 300
  temperature: 1.75
  top_p: 0.95
  top_k: 0
  entity_sampling: stochastic
  allow_end: false               # upstream Pix2SG generates a fixed number of relations
  matcher_n: 3
  matcher_depth: 10
  matcher_identity_fallback: false